:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101513;--card:#18201d;--fg:#e4ebe8;--muted:#95a39d;--line:#2a3531;--accent:#5fbf9f;--accent-soft:#1d2e28;--done:#5d6a65;--warn:#e08a72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101513;--card:#18201d;--fg:#e4ebe8;--muted:#95a39d;--line:#2a3531;--accent:#5fbf9f;--accent-soft:#1d2e28;--done:#5d6a65;--warn:#e08a72;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.nav{display:flex;gap:8px}
.nav a{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--fg);text-decoration:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nav a[aria-current="page"]{border-color:var(--accent);background:var(--accent-soft)}
.nav b{font-weight:600}
.nav span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.single{max-width:640px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-direction:column;gap:4px}
h1{font-size:22px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.save{font-size:12px;color:var(--muted)}
.save.err{color:var(--warn)}
section{display:flex;flex-direction:column;gap:8px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2{font-size:16px;font-weight:600;margin:0}
.cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 12px}
.row+.row,.list>.add{border-top:1px solid var(--line)}
.who{min-width:0;display:flex;flex-direction:column;gap:1px}
.name{font-weight:500;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:12.5px;user-select:all}
.note{font-size:12px;color:var(--accent)}
.date{font-size:12px;font-variant-numeric:tabular-nums;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 6px;align-self:flex-start;margin-top:2px}
.ticks{display:flex;gap:6px;align-items:center}
.tick{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;min-width:44px}
.tick input{width:22px;height:22px;margin:0;accent-color:var(--accent);cursor:pointer}
.del{background:none;border:none;color:var(--done);font:inherit;font-size:16px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:4px}
.del.arm{color:var(--warn);font-size:12px}
.row.done .name,.row.done .meta{text-decoration:line-through;color:var(--done)}
.row.done .note,.row.done .date{opacity:.5}
.empty{padding:14px 12px;color:var(--muted);font-size:13.5px}
.add{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
.add input{flex:1 1 140px;min-width:0;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.add button{font:inherit;font-size:14px;padding:6px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--card);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<script id="app">
(function(){
const HEAD='<title>Fanyi 实习投递</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">';
const LS="fanyi-intern-v1";
let items=JSON.parse(document.getElementById("data").textContent);
let region=(location.hash==="#cn")?"cn":"au", armed=null, timer=null, art=null, mode="init";

const CH=[["li","LinkedIn","人名","公司 / 备注"],["gm","Gmail","公司","邮箱 / 备注"],["web","官网","公司","岗位 / 渠道"]];
const RG=[["au","澳洲"],["cn","国内"]];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isDone=i=>i.ch==="li"?i.m:i.done;
const fmtDate=d=>{if(!d)return"";const[m,dd]=d.split("-");const wk=["日","一","二","三","四","五","六"][new Date(2026,+m-1,+dd).getDay()];return `周${wk} ${+m}/${+dd}`};

function section(rg,ch,label,ph1,ph2){
  const rl=RG.find(x=>x[0]===rg)[1];
  const rows=items.filter(i=>i.r===rg&&i.ch===ch);
  const d=rows.filter(isDone).length;
  const extra=ch==="li"?` · 已 Connect ${rows.filter(i=>i.c).length}`:"";
  let h=`<section><div class="sh"><h2>${label}</h2><span class="cnt">完成 ${d} / ${rows.length}${extra}</span></div><div class="list">`;
  if(!rows.length)h+=`<div class="empty">还没有，在下面添加第一条。</div>`;
  for(const i of rows){
    const sub=ch==="gm"?`<span class="meta mono">${esc(i.sub)}</span>`:(i.sub?`<span class="meta">${esc(i.sub)}</span>`:"");
    const ticks=ch==="li"
      ?`<label class="tick"><input type="checkbox" data-k="c" data-id="${i.id}" ${i.c?"checked":""}>Connect</label><label class="tick"><input type="checkbox" data-k="m" data-id="${i.id}" ${i.m?"checked":""}>私信</label>`
      :`<label class="tick"><input type="checkbox" data-k="done" data-id="${i.id}" ${i.done?"checked":""}>${ch==="gm"?"已发":"已投"}</label>`;
    h+=`<div class="row${isDone(i)?" done":""}"><div class="who"><span class="name">${esc(i.name)}</span>${sub}${i.note?`<span class="note">${esc(i.note)}</span>`:""}${i.date?`<span class="date">${fmtDate(i.date)}</span>`:""}</div>
    <div class="ticks">${ticks}<button class="del${armed===i.id?" arm":""}" data-del="${i.id}" aria-label="删除 ${esc(i.name)}">${armed===i.id?"确认删除":"×"}</button></div></div>`;
  }
  h+=`<form class="add" data-r="${rg}" data-ch="${ch}"><input id="a1-${rg}-${ch}" placeholder="${ph1}" aria-label="${rl} ${label} ${ph1}" required><input id="a2-${rg}-${ch}" placeholder="${ph2}" aria-label="${rl} ${label} ${ph2}"><button type="submit">添加</button></form></div></section>`;
  return h;
}
function render(){
  const root=document.getElementById("root");
  const sec=ch=>{const c=CH.find(x=>x[0]===ch);return section(region,c[0],c[1],c[2],c[3])};
  let h=`<div class="wrap"><header><h1>实习投递</h1><div class="sub"><span>勾选自动保存</span><span class="save" id="save"></span></div></header>
  <nav class="nav">${RG.map(([k,l])=>{const a=items.filter(i=>i.r===k);return `<a href="#${k}" ${region===k?'aria-current="page"':""}><b>${l}</b><span>完成 ${a.filter(isDone).length} / ${a.length}</span></a>`}).join("")}</nav>`;
  h+=region==="au"
    ?`<div class="cols"><div class="col">${sec("li")}${sec("gm")}</div><div class="col">${sec("web")}</div></div>`
    :`<div class="col single">${sec("li")}${sec("gm")}${sec("web")}</div>`;
  h+=`</div>`;
  root.innerHTML=h;
  showSave();
}
function showSave(){
  const el=document.getElementById("save"); if(!el)return;
  el.className="save"+(mode==="err"?" err":"");
  el.textContent={init:"",saving:"保存中…",saved:"已保存",local:"仅保存在这台设备",err:"没保存上，刷新后再试"}[mode]||"";
}
function buildDoc(){
  const reset=(document.head.querySelector("style")||{}).textContent||"";
  const css=document.getElementById("css").textContent;
  const app=document.getElementById("app").textContent;
  const json=JSON.stringify(items).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+HEAD+'<style id="css">'+css+'</style><div id="root"></div><script type="application/json" id="data">'+json+'<\/script><script id="app">'+app+'<\/script></body></html>';
}
function save(){
  try{localStorage.setItem(LS,JSON.stringify(items));}catch(e){}
  if(!art){mode="local";showSave();return;}
  mode="saving";showSave();
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    try{await art.publish(buildDoc());mode="saved";}
    catch(e){mode=(e&&e.code==="conflict")?"saved":"err";}
    showSave();
  },1500);
}
document.addEventListener("change",e=>{
  const t=e.target; if(!t.dataset||!t.dataset.id)return;
  const i=items.find(x=>x.id===t.dataset.id); if(!i)return;
  i[t.dataset.k]=t.checked;
  if(t.dataset.k==="m"&&t.checked)i.c=true;
  render();save();
});
document.addEventListener("click",e=>{
  const del=e.target.closest("[data-del]");
  if(del){
    const id=del.dataset.del;
    if(armed===id){items=items.filter(x=>x.id!==id);armed=null;render();save();}
    else{armed=id;render();setTimeout(()=>{if(armed===id){armed=null;render();}},3000);}
  }
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("form.add"); if(!f)return;
  e.preventDefault();
  const [a,b]=f.querySelectorAll("input");
  const name=a.value.trim(); if(!name)return;
  const n=items.reduce((mx,x)=>Math.max(mx,+String(x.id).slice(1)||0),0)+1;
  items.push({id:"i"+n,r:f.dataset.r,ch:f.dataset.ch,name,sub:b.value.trim(),note:"",date:"",c:false,m:false,done:false});
  render();save();
  const again=document.getElementById(a.id); if(again)again.focus();
});
window.addEventListener("hashchange",()=>{region=(location.hash==="#cn")?"cn":"au";armed=null;render();window.scrollTo(0,0);});
render();
(async()=>{
  try{ if(window.claude&&window.claude.use){art=await window.claude.use("artifact");} }catch(e){art=null;}
  if(!art){
    try{const s=JSON.parse(localStorage.getItem(LS)); if(Array.isArray(s)&&s.length){items=s;render();}}catch(e){}
    mode="local";showSave();
  }
})();
})();
</script>
