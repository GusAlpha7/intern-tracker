}

:root[data-theme="dark"]{--bg:#101513;--card:#18201d;--fg:#e4ebe8;--muted:#95a39d;--line:#2a3531;--accent:#5fbf9f;--accent-soft:#1d2e28;--done:#5d6a65;--warn:#e08a72;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;

.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.nav{display:flex;gap:8px}
@media (max-width:520px){.nav{flex-wrap:wrap}.nav a{flex:1 1 28%;flex-direction:column;align-items:flex-start;gap:0}}
.intro{margin:0;font-size:13.5px;color:var(--muted);max-width:68ch}
.cities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}

.city{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}

h3{font-size:17px;font-weight:600;margin:0}

.city ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.5}
.pend{display:inline-block;font-size:11px;line-height:1.5;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;white-space:nowrap;vertical-align:1px}
.none{margin:0;font-size:13.5px;color:var(--muted)}

.del.arm{color:var(--warn);font-size:12px}
.row.done .name,.row.done .meta{text-decoration:line-through;color:var(--done)}
.row.done .note,.row.done .date{opacity:.5}
.empty{padding:14px 12px;color:var(--muted);font-size:13.5px}
.add{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}

.add button{font:inherit;font-size:14px;padding:6px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--card);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kb{display:flex;flex-direction:column;gap:10px;max-width:860px}
.kbtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kbtools input{flex:1 1 220px;min-width:0;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.kbnote{font-size:13px;color:var(--muted)}
.kb h2{margin-top:10px}
details.co{background:var(--card);border:1px solid var(--line);border-radius:10px}
details.co>summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none}
details.co>summary::-webkit-details-marker{display:none}
details.co>summary::before{content:"▸ ";color:var(--muted)}
details.co[open]>summary::before{content:"▾ "}
details.co[open]>summary{border-bottom:1px solid var(--line)}
.cobody{padding:4px 14px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cobody h3{font-size:14.5px;margin:12px 0 2px;color:var(--accent)}
.md{font-size:14px;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.md p{margin:6px 0}
.md ul{margin:4px 0;padding-left:20px}
.md li{margin:2px 0}
.md a{color:var(--accent)}
.tw{overflow-x:auto;margin:6px 0}
.md table{border-collapse:collapse;font-size:13px;min-width:560px;overflow-wrap:normal}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md th{background:var(--accent-soft)}
.sk{display:flex;flex-direction:column;gap:8px;max-width:520px}
.skc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}

.lv{font-size:12px;color:var(--accent);white-space:nowrap;letter-spacing:.1em}

.skr span:first-child{color:var(--muted);font-size:12.5px;padding-top:2px}

nager（悉尼）、Sales Director（墨尔本），没有实习"}, {"h": "相关岗位", "md": "| 岗位 | 类型 | 地点 | 要求要点 | 匹配 / 缺口 |\n| --- | --- | --- | --- | --- |\n| AC 产品工程师 | 全职 | 厦门 | 硕士，专业含能源与动力、新能源；PCS 竞品分析、产品定义；调研 IEC、UL、AS/NZS、VDE 并网标准 | 在澳洲读书是优势 |\n| 电气设计工程师（场站方向） | 全职 | 深圳 | 硕士，电气优先；新能源场站选型、电气计算、一二次图纸；会 PSCAD、DigSilent、Matlab | 偏电气专业，匹配度低 |\n| 测试认证工程师 | 全职 | 深圳 | 本科及以上；解读各国并网标准（IEC、EN、VDE）、构网、高低压穿越 | 门槛最低 |\n| 产品经理（系统） | 全职 | 厦门 | 硕士，专业含能源动力、新能源；市场调研、需求管理、产品生命周期 | 需要 Excel / PPT 和分析能力 |"}, {"h": "投递方式", "md": "- 校招：官网 Moka 系统投递\n- 官方明确接受邮件：GlobalRecruitment@Hithium.com（官网 Careers 页公开）\n- 官方提醒不要相信外部收费内推"}, {"h": "面经", "md": "- 暂无"}]}, {"name": "汇川技术（Inovance）", "intro": "", "secs": [{"h": "公司概况", "md": "- 苏州 / 深圳，国内工控龙头（伺服、变频器、PLC）；四大业务：工业自动化与数字化、新能源汽车动力系统（联合动力）、智能机器人、数字能源（储能 PCS、储能电站）\n- 员工 2 万余人，2025 年营收 451 亿元"}, {"h": "澳洲业务", "md": "- 没有澳洲公司，LinkedIn 搜不到澳洲岗位\n- 27 届海外工作地有泰国、越南、马来西亚、印尼、韩国、印度、土耳其、英国、法国、西班牙、意大利、德国，没有澳洲"}, {"h": "招聘现状（2026-11-04 查）", "md": "- 国内 27 届：收 **2027 年 1–12 月**毕业（海外以学位证为准）→ **你符合**\n- 新官网 recruit.inovance.com 现有 293 个校招岗位，大多是联合动力（新能源车）和工控研发；数字能源只有 4 个\n- 流程：网申 / 内推 → 线上测评 → 简历初筛 → 面试 → 录用说明会 → offer\n- 数字能源岗位都有**成绩门槛**（班级前 3–10% 或专业前 20–30%，写明是必要条件）；留学生怎么核算没写，需确认（你 WAM 约 82）\n- 实习 / 见习：官网 36 个，大多是工控、AI、测试和大连汇川的岗位；和你相关的见下"}, {"h": "相关岗位", "md": "**最匹配（数字能源，27 届校招）**\n\n1. **全球储能系统解决方案工程师**（苏州 / 英国 / 德国，本科以上）：电气、**能源动力**、储能、电力系统；做海外储能项目技术支持，写解决方案、英文技术协议和投标材料；CET-6；成绩班级前五或专业前 25% → 下面面经就是这个岗位\n2. **全球储能电站产品经理**（苏州，硕士）：电气、**能源动力**、自动化；做市场调研、产品规划、上市和定价；入职先在解决方案和研发轮岗 18–24 个月；CET-6；成绩班级前三或专业前 20%\n3. **海外储能电站技术营销工程师**（德国 / 法国 / 意大利 / 苏州，本科）：电气、**新能源**、能源动力优先；海外大储 PCS 销售，跟踪当地储能政策、电价和并网标准；先在技术岗轮岗 12 个月；高频海外出差\n4. **国内储能电站技术营销工程师**（全国，本科）：同上，国内方向\n\n**实习 / 见习**\n\n- **\\[27 届见习生\\] 技术服务工程师-储能**（苏州）：专业含**新能源科学与工程、能源与动力工程**，要可再生能源基础；储能电站现场安装调试、编写调试文档、运维；频繁出差，有电工证优先 → 专业对口，但偏现场\n- 仿真工程师实习（苏州，需实习半年以上）：做 PCS 并网模型仿真测试，要会 ADPSS 或 PSCAD、潮流计算和高低电压穿越 → 偏电力系统，你匹配度低\n\n**不合适**：联合动力各研发岗、产品经理管培生（工控方向，要 PLC 编程）、AI / 算法类"}, {"h": "投递方式", "md": "- 新官网 recruit.inovance.com（校园招聘 / 实习生招聘），或公众号「汇川技术招聘」；旧官网 inovance.zhiye.com 已经没有岗位\n- 未见公开招聘邮箱\n- 校园大使（2027 届及以后）可获内推优先，今年 7–8 月的招募已结束"}, {"h": "面经", "md": "**岗位：全球储能系统解决方案工程师（海外方向）· 27届秋招**\n\n**一面形式**：线上，约 30 分钟，面试官是战区技术负责人，无压力面；没有偏题，重基础功底 + 售前思维\n\n**一、专业基础题（占比最高，强电 + 电力电子）**\n\n1. 双向 DC-DC 拓扑原理？储能为什么要用双向？\n2. MOS 管和 IGBT 的区别，重点是开关特性\n3. 你做过的电源项目里 MOS 开关频率大概多少？\n4. 继电保护四大核心特性\n5. 常见继电保护类型\n6. 三段式过流保护是哪三段、各自作用\n7. 电力系统短路容量怎么算\n8. 功率因数；有功、无功、视在功率的关系\n\n踩坑：说反了 IGBT 和 MOS 的频率特性；短路容量完全没答上\n\n**二、经历深挖题（看有没有方法论）**\n\n1. 强电专业为什么实习偏市场/售前？\n2. 实习里的市场洞察 SOP 是什么样的？\n3. 怎么理解 ToB 销售的「铁三角」协作模式？\n4. 竞品分析从哪些维度切入？\n\n**三、行业 & 岗位认知题**\n\n1. 储能系统由哪几部分组成？\n2. 汇川在储能产业链做哪块、核心优势？\n3. 让你做 PCS 竞品分析，从哪些维度对比？\n\n**作者建议**\n\n- 技术重点补：PCS 基础原理、储能并网（短路容量、短路比 SCR、继电保护配合）、主流厂商格局\n- 经历往「方案输出、客户对接、竞品分析」靠，岗位很看重售前思维\n- 海外方向：准备英文自我介绍、储能核心术语英文表达，大概率有英文考察\n\n岗位画像：技术 + 商务复合岗，不纯研发也不纯销售，适合有工科底子又愿意对接人的强电学生\n\n来源：小红书 @Mr. Brightside，2026-11\n\n**岗位：海外储能技术营销（数字能源）· 二面 · 全英文 · 27 届秋招**\n\n**形式**：约 30 分钟，全程英文自我介绍和问答，反问中英文都可以；面试官是海外销售线的 BP；面完 15 分钟收到三面通知。同一作者，一面那篇写的岗位是「全球储能系统解决方案工程师（海外方向）」，这篇写「海外储能技术营销岗」\n\n**流程**\n\n1. 全英文自我介绍\n2. 对上一轮技术面的感受、对岗位的理解\n3. 简历深挖：实习职责、在团队里的角色\n4. 海外业务情景模拟题\n5. 稳定性追问：留学打算、家人对出差的态度\n6. 自由反问\n\n**高频英文问题**（截图只看到前 4 个）：2–3 分钟版自我介绍；实习的核心职责；商务会议中你的角色；对第一轮技术面的感受\n\n**作者技巧**\n\n- 英文回答重逻辑、轻完美：按「核心观点 → 支撑动作 → 价值结果」组织，3–5 句收尾\n- 情景题先拆维度再答，例如见客户前的准备，按「客户背景 → 本地合规 → 沟通偏好 → 历史记录」展开\n- 所有回答都落回「技术理解 + 商务思维 + 海外适配」\n- 反问问选人标准、行业判断、成长路径，别只问薪资和培训\n\n**面试官说的选人标准**\n\n1. 英语是硬门槛：不用到母语水平，但要能顺畅沟通业务\n2. 沟通意愿比技巧重要：海外客户边界感强、问得细，要主动沟通、主动跟进\n3. 工科背景优先：教工科生英语，比教英语专业的人储能知识容易得多\n\n核心画像：学得会技术、愿意跑客户、能长期深耕海外\n\n来源：小红书 @Mr. Brightside，2026-11（三面待更新）"}]}, {"name": "阳光电源（Sungrow）", "intro": "", "secs": [{"h": "公司概况", "md": "- 合肥，光伏逆变器和储能系统龙头；截至 2025 年底，全球累计装机电力电子变换器超 1,000 GW\n- 2026 年在波兰建首个亚洲以外的逆变器和储能工厂"}, {"h": "澳洲业务", "md": "- 在澳 13 年，北悉尼办公室；本地团队 90 多人，其中工程师和技术员约 60 人，有 3,000 平方米服务物流中心；LinkedIn 显示 51 位 UNSW 校友在职\n- 项目：WA Cunderdin（澳洲最大的运营中 DC 耦合光储）、VIC Hazelwood 扩建 150 MW / 300 MWh（2026-10 签约，ENGIE）、Halys BESS（规划超 3 GWh）、Templers、Pelican Point；户用和工商储通过 Raystech、Supp （理化材料、电力电子两个方向，宁德，各约 36 人）：硕士；材料、能源、电力电子、储能、新能源优先；英语优秀；工作是分析客户需求、设计系统方案、做技术交流 → 就是那篇面经的岗位\n2. **储能系统解决方案工程师**（宁德，约 20 人）：本科以上；电气、能源动力、电力电子等；英语能作工作语言，**海外留学背景优先**；做售前方案、投标、运维技术支持；要能海外出差\n3. **储能直流侧可靠性工程师**（宁德）：本科以上；专业含能源与动力、新能源、储能；CET-6；用 FMEA、可靠性数据做风险管理；懂电网拓扑加分\n4. **零碳战略**（宁德，2 人）：硕士，**海外学历优先**；能源与动力工程等；英语能作工作语言；做碳足迹和标准制定\n5. **储能系统开发**（宁德）：硕士；电力系统、电力电子等；会 PSCAD、Matlab、Simulink 任一即可；做继电保护、协调控制、标准解读；专业要求是电力系统、电力电子等电气类，和你的背景对不上，实际属于次匹配\n6. **EMS 产品工程师**（宁德）：硕士；电气、电力系统、新能源；CET-6；懂储能电站和电力市场加分\n\n**次匹配**\n\n- 海外储能项目管理工程师（约 44 人）、海外储能市场分析工程师（硕士，新能源相关）、储能电力交易产品工程师（要会 SQL、Python）、储能交流侧可靠性工程师（电气优先）、储能系统安全工程师（要会 PSCAD 等仿真）、规划和发展分析师\n\n**不合适**：电芯、材料、工艺、嵌入式、AI 算法、机器人类岗位"}, {"h": "投递方式", "md": "- 官网 Talent.CATL.com → 2027 届全球校园招聘（Moka 系统），或公众号「CATL宁德时代招聘」\n- 没找到公开的招聘邮箱，校招只能网申\n- 澳洲方向：关注 UNSW 与 CATL 的 CIRETI 合作动态（www.cireti.org），或在 LinkedIn 联系 CATL Australia 团队"}, {"h": "面经", "md": "**岗位：海外储能理化材料解决方案岗 · 技术面**\n\n**形式**：只有自我介绍用英文，其余中文；需**自备 PPT**（教育背景、科研、两段实习），面试官对着简历和 PPT 逐条深挖，节奏紧、压力大；会直接点出背景不对口，再用锂电基础考学习能力\n\n**问题**\n\n- 实习深挖（作者原背景：半导体工艺 + 电源硬件）：主要负责什么；光刻完整流程；每个工艺参数为什么这么设（追问很细）；用到的两个拓扑结构；入电结构、通讯板、信号板相关问题\n- 岗位与公司：怎么理解这个岗位；对宁德时代及其储能产品的了解；背景不对口你怎么回答；锂电池的基本结构\n- 工作模式：能否接受出差（必问，海外岗要去现场处理失效、对接海外客户）；你的缺点\n\n**要点**\n\n- 英文自我介绍要练熟；PPT 配图很关键，写上去的每个参数、结构都要吃透\n- 跨方向要讲清哪些能力能迁移（作者讲的是表征、缺陷分析、工艺稳定性 → 锂电失效、安全分析）\n- 锂电基础（电芯结构等）是送分题，必须背\n- 提前想好出差问题的回答\n\n来源：小红书 @秉谦禾"}]}, {"name": "亿纬锂能（EVE）", "intro": "", "secs": [{"h": "公司概况", "md": "- 惠州，锂电池；2025 年储能电池出货全球前二"}, {"h": "澳洲业务", "md": "- 在招：Human Resources Consultant（墨尔本），说明在组建澳洲团队；暂无工程岗"}, {"h": "招聘现状（2026-11-04 查）", "md": "- 27 届毕业时间口径未查到\n- 实习未查到"}, {"h": "相关岗位", "md": "- 名单写动力电池研发、储能系统、电化学、工艺"}, {"h": "投递方式", "md": "- 未查到招聘邮箱"}, {"h": "面经", "md": "- 暂无"}]}, {"name": "中创新航（CALB）", "intro": "", "secs": [{"h": "公司概况", "md": "- 动力和储能电池"}, {"h": "澳洲业务", "md": "- LinkedIn 未见"}, {"h": "招聘现状（2026-11-04 查）", "md": "- 江门基地 27 届 6–8 月已招，岗位为设备、电芯工艺、IE、安全、生产计划等制造类\n- 毕业时间口径未查到\n- 实习未查到"}, {"h": "相关岗位", "md": "- 名单写电芯设计、电池系统、电化学、工艺整合；以制造和工艺为主，和你背景对口度低"}, {" <script id="app">
(function(){
const HEAD='<title>Fanyi 实习投递</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">';
const LS="fanyi-intern-v1";
let items=JSON.parse(document.getElementById("data").textContent);
const KB=(()=>{try{return JSON.parse(document.getElementById("kb").textContent)}catch(e){return {companies:[],other:[]}}})();
const SK=(()=>{try{return JSON.parse(document.getElementById("sk").textContent)}catch(e){return []}})();
const SEEDLH=items.filter(i=>i.r==="lh");
const pickRegion=()=>{const h=location.hash.slice(1);return ["au","cn","lh","co","sk"].includes(h)?h:"au"};
let region=pickRegion(), armed=null, timer=null, art=null, mode="init";

const CH=[["pf","BOSS 等平台","公司 · 岗位","平台 / 备注"],["li","LinkedIn","人名","公司 / 备注"],["gm","Gmail","公司","邮箱 / 备注"],["web","官网","公司","岗位 / 渠道"]];
const RG=[["au","澳洲"],["cn","国内"],["lh","落户"]];
const LH=[["t1","一线城市"],["t2","其他城市"]];

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isDone=i=>i.ch==="li"?i.m:i.done;
const fmtDate=d=>{if(!d)return"";const[m,dd]=d.split("-");const wk=["日","一","二","三","四","五","六"][new Date(2026,+m-1,+dd).getDay()];return `周${wk} ${+m}/${+dd}`};

function section(rg,ch,label,ph1,ph2){
  const rl=RG.find(x=>x[0]===rg)[1];
  const rows=items.filter(i=>i.r===rg&&i.ch===ch);
  const d=rows.filter(isDone).length;
  const extra=ch==="li"?` · 已 Connect ${rows.filter(i=>i.c).length}`:"";
  let h=`<section><div class="sh"><h2>${label}</h2><span class="cnt">完成 ${d} / ${rows.length}${extra}</span></div><div class="list">`;
  if(!rows.length)h+=`<div class="empty">还没有，在下面添加第一条。</div>`;
  for(const i of rows){
    const sub=ch==="gm"?`<span class="meta mono">${esc(i.sub)}</span>`:(i.sub?`<span class="meta">${esc(i.sub)}</span>`:"");
    const ticks=ch==="li"
      ?`<label class="tick"><input type="checkbox" data-k="c" data-id="${i.id}" ${i.c?"checked":""}>Connect</label><label class="tick"><input type="checkbox" data-k="m" data-id="${i.id}" ${i.m?"checked":""}>私信</label>`
      :`<label class="tick"><input type="checkbox" data-k="done" data-id="${i.id}" ${i.done?"checked":""}>${ch==="gm"?"已发":"已投"}</label>`;
    h+=`<div class="row${isDone(i)?" done":""}"><div class="who"><span class="name">${esc(i.name)}</span>${sub}${i.note?`<span class="note">${esc(i.note)}</span>`:""}${i.date?`<span class="date">${fmtDate(i.date)}</span>`:""}</div>
    <div class="ticks">${ticks}<button class="del${armed===i.id?" arm":""}" data-del="${i.id}" aria-label="删除 ${esc(i.name)}">${armed===i.id?"确认删除":"×"}</button></div></div>`;
  }
  h+=`<form class="add" data-r="${rg}" data-ch="${ch}"><input id="a1-${rg}-${ch}" placeholder="${ph1}" aria-label="${rl} ${label} ${ph1}" required><input id="a2-${rg}-${ch}" placeholder="${ph2}" aria-label="${rl} ${label} ${ph2}"><button type="submit">添加</button></form></div></section>`;
  return h;
}
function bullets(arr){
  if(!arr||!arr.length)return `<p class="none">待补充</p>`;
  return `<ul>${arr.map(x=>`<li>${esc(x.t)}${x.ok===false?`<span class="pend">待核实</span>`:""}</li>`).join("")}</ul>`;
}
function cityCard(i,canDel){
  const src=(i.src&&i.src.length)?`<p class="srcs">来源：${i.src.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.l)}</a>`).join("、")}</p>`:"";
  const del=canDel?`<button class="del${armed===i.id?" arm":""}" data-del="${i.id}" aria-label="删除 ${esc(i.name)}">${armed===i.id?"确认删除":"×"}</button>`:"";
  return `<article class="city"><div class="city-h"><h3>${esc(i.name)}</h3>${del}</div><h4>落户条件</h4>${bullets(i.cond)}${i.ch==="gen"?`<h4>福利</h4>${bullets(i.perk)}`:`<h4>落户福利</h4>${bullets(i.perk)}<h4>人才引进福利</h4>${bullets(i.talent)}`}${src}</article>`;
}
function citySection(ch,label){
  const rows=items.filter(i=>i.r==="lh"&&i.ch===ch);
  return `<section><div class="sh"><h2>${label}</h2><span class="cnt">${rows.length} 个城市</span></div><div class="cities">${rows.map(i=>cityCard(i,true)).join("")}</div>
  <form class="add addcity" data-r="lh" data-ch="${ch}"><input id="a1-lh-${ch}" placeholder="添加城市" aria-label="${label} 添加城市" required><button type="submit">添加</button></form></section>`;
}
function render(){

  let h=`<div class="wrap"><header><h1>${region==="lh"?"毕业后落户":region==="co"?"公司库":region==="sk"?"技能养成":"实习投递"}</h1><div class="sub"><span>勾选自动保存</span><span class="save" id="save"></span></div></header>
  <nav class="nav">${RG.map(([k,l])=>{const a=items.filter(i=>i.r===k);return `<a href="#${k}" ${region===k?'aria-current="page"':""}><b>${l}</b><span>${k==="lh"?`${a.filter(i=>i.ch!=="gen").length} 个城市`:`完成 ${a.filter(isDone).length} / ${a.length}`}</span></a>`}).join("")}<a href="#co" ${region==="co"?'aria-current="page"':""}><b>公司库</b><span>${KB.companies.length} 家</span></a><a href="#sk" ${region==="sk"?'aria-current="page"':""}><b>技能养成</b><span>${SK.length} 项</span></a></nav>`;
  h+=region==="sk"?skPage():region==="co"?kbPage():region==="lh"
    ?`<div class="col"><p class="intro">每个城市依次列落户条件、落户后才有的福利、在当地工作就能拿的人才引进福利。标「待核实」的来自机构文章或各处说法不一，申请前以当地人社局为准。</p>${items.filter(i=>i.r==="lh"&&i.ch==="gen").map(i=>cityCard(i,false)).join("")}${LH.map(([k,l])=>citySection(k,l)).join("")}</div>`
    :region==="au"
    ?`<div class="cols"><div class="col">${sec("li")}${sec("gm")}</div><div class="col">${sec("web")}</div></div>`
    :`<div class="cols"><div class="col">${sec("pf")}</div><div class="col">${sec("web")}</div></div>`;
  h+=`</div>`;
  root.innerHTML=h;
  showSave();
}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|[\s（(])(https?:\/\/[^\s<）)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>')}
function md(src){
  const L=String(src||"").split("\n");let h="",i=0;
  while(i<L.length){const l=L[i];
    if(/^\s*\|/.test(l)){const rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i]);i++;}
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const body=rows.filter((r,k)=>k!==1||!/^[\s|:-]+$/.test(r));
      h+='<div class="tw"><table>'+body.map((r,k)=>"<tr>"+cells(r).map(c=>k===0?`<th>${inl(c)}</th>`:`<td>${inl(c)}</td>`).join("")+"</tr>").join("")+"</table></div>";continue;}
    if(/^\s*[-*] /.test(l)){h+="<ul>";while(i<L.length&&/^\s*[-*] /.test(L[i])){h+="<li>"+inl(L[i].replace(/^\s*[-*] /,""))+"</li>";i++;}h+="</ul>";continue;}
    if(!l.trim()){i++;continue;}
    h+="<p>"+inl(l)+"</p>";i++;}
  return h;
}
function skPage(){
  const dots=n=>"●".repeat(n)+"○".repeat(3-n);
  return `<div class="sk"><div class="kbnote">○○○ 没有　●●● 强项</div><div class="list">${SK.map(k=>`<div class="row"><div class="who"><span class="name">${esc(k.s)}</span><span class="meta">${k.need.map(esc).join("、")}</span></div><span class="lv">${dots(k.lv)}</span></div>`).join("")}</div></div>`;
}
function kbPage(){
  let h=`<div class="kb"><div class="kbtools"><input id="kbq" type="search" placeholder="搜公司或关键词，比如 储能、实习、澳洲" aria-label="搜索公司库"></div>
  <div class="kbnote">来自小红书知识库（2026-11-04 整理），只读，和上面的投递记录分开。</div>`;
  KB.companies.forEach((c,ix)=>{h+=`<details class="co" data-ix="${ix}"><summary>${esc(c.name)}</summary><div class="cobody">${c.intro?`<div class="md">${md(c.intro)}</div>`:""}${c.secs.map(s=>`<h3>${esc(s.h)}</h3><div class="md">${md(s.md)}</div>`).join("")}</div></details>`;});
  if(KB.other.length){h+=`<h2>求职方法</h2>`;KB.other.forEach(o=>{h+=`<details class="co"><summary>${esc(o.h)}</summary><div class="cobody"><div class="md">${md(o.md)}</div></div></details>`;});}
  return h+`</div>`;
}
document.addEventListener("input",e=>{if(e.target.id!=="kbq")return;const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll("details.co[data-ix]").forEach(d=>{const c=KB.companies[+d.dataset.ix];const txt=(c.name+" "+c.intro+" "+c.secs.map(s=>s.h+" "+s.md).join(" ")).toLowerCase();d.hidden=!!q&&!txt.includes(q);});});
function showSave(){
  const el=document.getElementById("save"); if(!el)return;
  el.className="save"+(mode==="err"?" err":"");
  el.textContent={init:"",saving:"保存中…",saved:"已保存",local:"仅保存在这台设备",err:"没保存上，刷新后再试"}[mode]||"";
}
function buildDoc(){
  const reset=(document.head.querySelector("style")||{}).textContent||"";
  const css=document.getElementById("css").textContent;
  const app=document.getElementById("app").textContent;
  const json=JSON.stringify(items).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+HEAD+'<style id="css">'+css+'</style><div id="root"></div><script type="application/json" id="data">'+json+'<\/script><script type="application/json" id="sk">'+document.getElementById("sk").textContent+'<\/script><script type="application/json" id="kb">'+document.getElementById("kb").textContent+'<\/script><script id="app">'+app+'<\/script></body></html>';
}
function save(){
  try{localStorage.setItem(LS,JSON.stringify(items));}catch(e){}
  if(!art){mode="local";showSave();return;}
  mode="saving";showSave();
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    try{await art.publish(buildDoc());mode="saved";}
    catch(e){mode=(e&&e.code==="conflict")?"saved":"err";}
    showSave();
  },1500);
}
document.addEventListener("change",e=>{
  const t=e.target; if(!t.dataset||!t.dataset.id)return;
  const i=items.find(x=>x.id===t.dataset.id); if(!i)return;
  i[t.dataset.k]=t.checked;
  if(t.dataset.k==="m"&&t.checked)i.c=true;
  render();save();
});
document.addEventListener("click",e=>{
  const del=e.target.closest("[data-del]");
  if(del){
    const id=del.dataset.del;
    if(armed===id){items=items.filter(x=>x.id!==id);armed=null;render();save();}
    else{armed=id;render();setTimeout(()=>{if(armed===id){armed=null;render();}},3000);}
  }
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("form.add"); if(!f)return;
  e.preventDefault();
  const [a,b]=f.querySelectorAll("input");
  const name=a.value.trim(); if(!name)return;
  const n=items.reduce((mx,x)=>Math.max(mx,+String(x.id).slice(1)||0),0)+1;
  items.push({id:"i"+n,r:f.dataset.r,ch:f.dataset.ch,name,sub:b?b.value.trim():"",note:"",date:"",c:false,m:false,done:false});
  render();save();
  const again=document.getElementById(a.id); if(again)again.focus();
});
window.addEventListener("hashchange",()=>{region=pickRegion();armed=null;render();window.scrollTo(0,0);});
render();
(async()=>{
  try{ if(window.claude&&window.claude.use){art=await window.claude.use("artifact");} }catch(e){art=null;}
  if(!art){
    try{const s=JSON.parse(localStorage.getItem(LS)); if(Array.isArray(s)&&s.length){items=s;if(!items.some(i=>i.r==="lh"&&i.cond)){items=items.filter(i=>i.r!=="lh").concat(SEEDLH);}render();}}catch(e){}
    mode="local";showSave();
  }
})();
})();
</script>
